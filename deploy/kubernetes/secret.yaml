apiVersion: v1
kind: Secret
metadata:
  name: metamcp-secret
  namespace: ${METAMCP_NAMESPACE}
  labels:
    app.kubernetes.io/name: metamcp
    app.kubernetes.io/component: app
type: Opaque
stringData:
  postgres-password: "${METAMCP_POSTGRES_PASSWORD}"
  better-auth-secret: "${METAMCP_BETTER_AUTH_SECRET}"
  # Key protecting stored MCP server credentials (openssl rand -base64 32).
  # Back it up separately from the database.
  secrets-encryption-key: "${METAMCP_SECRETS_ENCRYPTION_KEY}"
  bootstrap-user-password: "${METAMCP_BOOTSTRAP_USER_PASSWORD}"
