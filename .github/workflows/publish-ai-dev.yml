name: Publish MetaMCP ai-dev image to GHCR

on:
  push:
    branches:
      - ai-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metamcp-ai-dev-image
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dyung26/metamcp
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=ai-dev
          labels: |
            org.opencontainers.image.source=https://github.com/DYung26/metamcp
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ghcr.io/dyung26/metamcp
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
